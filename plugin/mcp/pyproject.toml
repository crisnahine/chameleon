[project]
name = "chameleon-mcp"
version = "4.8.0"
description = "MCP server for chameleon. Auto-derives codebase conventions and serves archetype-keyed guidance via stdio JSON-RPC."
authors = [
    { name = "Cris Nahine", email = "crisjosephnahine@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    # FastMCP framework. The <2 cap is load-bearing, not caution: mcp 2.0.0
    # deleted `mcp.server.fastmcp` outright (FastMCP became MCPServer under
    # `mcp.server.mcpserver`, with no compatibility alias), so server.py's
    # import raises ModuleNotFoundError and the whole stdio server fails to
    # start. uvx -- how an installed plugin launches the server -- resolves
    # from this file and ignores uv.lock, so the lockfile's 1.x pin protects
    # only the development venv; an unbounded range here ships a server that
    # dies on first connect for every user. Lifting the cap means porting
    # server.py to the MCPServer API, not just widening the range.
    "mcp>=1.2.0,<2",
    "xxhash>=3.5.0",         # Non-crypto hash for sha_hint (drift.db, canonicals)
    "detect-secrets>=1.5.0", # Secret scanner for canonical excerpts
    "pyyaml>=6.0",           # tsconfig-adjacent + .eslintrc.yml + pnpm-workspace.yaml parsing
    "libcst>=1.1.0",         # Lossless Python CST for the Python extractor (scripts/libcst_dump.py)
    # Tree-sitter parsers, in-process. Every entry is the newest release that
    # exists on PyPI; typescript and ruby look behind only because no newer one
    # is published. Note that tree-sitter-typescript's `tree-sitter~=0.23`
    # requirement applies to its `core` extra, not to the wheel, so it does not
    # cap the core.
    #
    # A grammar wheel encodes a Language ABI number the core must accept, and
    # the two float independently. The direction of that constraint is worth
    # stating because the obvious reading is backwards: a NEWER core accepts
    # OLDER grammars -- 0.26 loads the ABI-14 typescript grammar and the ABI-15
    # python one in the same process -- so an incompatibility appears only when
    # the core is held DOWN while a grammar floats up. Pinning the core high and
    # exactly is what keeps that from happening by accident.
    #
    # Grammars are pinned exactly rather than bounded because a grammar bump
    # changes parse output. The differential harness
    # (tests/differential_treesitter.py --strict) is what certifies any
    # replacement: it compares every field the reference dumpers emit, and this
    # exact set reproduces them.
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-python==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
chameleon-mcp = "chameleon_mcp.server:main"
chameleon-gate = "chameleon_mcp.gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chameleon_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    # Module-level imports are intentionally placed inside functions /
    # methods throughout chameleon_mcp/ to keep server startup fast (the
    # MCP cold-start budget is ~150ms; eagerly importing every tool's
    # dependencies blows that).
    "E402",
    # Long lines are mostly user-facing strings (error messages, idiom
    # markdown templates) where reflowing reduces readability.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Test files can repeat themselves and import where they please.
# Path is relative to this pyproject.toml; the test suite lives two levels
# above (`../../tests/`) when running from `plugin/mcp/`.
"../../tests/**" = ["B007"]
