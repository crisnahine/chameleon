# Release-tag gate for chameleon.
#
# Fires on any tag matching `v*.*.*`. Verifies that:
#   1. All 6 manifests in .version-bump.json agree on the tagged version.
#   2. plugin/mcp/pyproject.toml's [project] version matches.
#   3. plugin/mcp/chameleon_mcp/__init__.py:__version__ matches.
#   4. CHANGELOG.md has an entry for the tagged version (heading like
#      `## [0.3.0]`).
#
# After verification, runs the full Python test matrix (same suites as
# ci.yml's test-python job) plus the gates that cover the SHIPPED surface --
# ruff, shellcheck, the hook-wrapper smoke matrix, and the hooks/skills
# manifest check -- then builds a plugin tarball (plugin/ +
# README/LICENSE/CHANGELOG), and publishes a
# GitHub Release with the CHANGELOG entry as the body plus every published
# effectiveness run's run.md/metrics.json as extra assets (skipped when
# tests/effectiveness/results-published/ is absent or empty).
#
# Those shipped-surface jobs are duplicated from ci.yml on purpose. ci.yml is
# scoped to pushes and PRs against main; nothing in the repo requires a tag to
# sit on a merged commit, so a tag cut from a release branch is gated by THIS
# file alone. Without them, a hook wrapper that lost its +x bit, a hooks.json
# entry pointing at a renamed script, or a shellcheck-fatal hook edit ships
# inside a fully green release run. Keep each job in step with its ci.yml twin.
#
# To cut a release:
#   1. bash scripts/bump-version.sh <new-version>           # 6 manifests
#   2. Append the version entry to CHANGELOG.md.
#   3. git commit + git tag v<new-version> + git push --tags.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-tag:
    name: verify-tag (manifests + CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Tag: $TAG -> Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify all 6 manifests agree (bump-version.sh --check)
        run: bash scripts/bump-version.sh --check

      - name: Verify all 6 manifests match the tagged version
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          # bump-version.sh --check confirms the 6 manifests agree with each
          # OTHER, but not that they agree with the tag. Compare one
          # manifest (canonical: plugin/.claude-plugin/plugin.json) against the
          # extracted version.
          MANIFEST_VERSION=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag is v$VERSION but plugin/.claude-plugin/plugin.json reports $MANIFEST_VERSION" >&2
            exit 1
          fi
          echo "Manifest version matches tag: $VERSION"

      - name: Verify plugin/mcp/pyproject.toml version matches the tag
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          PY_VERSION=$(grep -E '^version = ' plugin/mcp/pyproject.toml | head -n 1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$PY_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag is v$VERSION but plugin/mcp/pyproject.toml reports $PY_VERSION" >&2
            exit 1
          fi
          echo "plugin/mcp/pyproject.toml version matches tag: $VERSION"

      - name: Verify plugin/mcp/chameleon_mcp/__init__.py __version__ matches the tag
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          INIT_VERSION=$(grep -E '^__version__ = ' plugin/mcp/chameleon_mcp/__init__.py | head -n 1 | sed -E 's/__version__ = "(.*)"/\1/')
          if [ "$INIT_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag is v$VERSION but plugin/mcp/chameleon_mcp/__init__.py reports $INIT_VERSION" >&2
            exit 1
          fi
          echo "plugin/mcp/chameleon_mcp/__init__.py __version__ matches tag: $VERSION"

      - name: Verify CHANGELOG.md has an entry for this version
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "ERROR: no '## [${VERSION}]' heading found in CHANGELOG.md" >&2
            exit 1
          fi
          echo "CHANGELOG.md has an entry for $VERSION"

  test-all:
    name: test-all (py${{ matrix.python-version }} / ${{ matrix.os }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'plugin/mcp/uv.lock'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'plugin/mcp/package-lock.json'

      - name: Set up Ruby (Ruby extractor golden corpus)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'  # 3.3+ bundles prism

      - name: Install Python dependencies (uv sync)
        working-directory: plugin/mcp
        run: uv sync --frozen --extra dev

      - name: Install Node dependencies (TypeScript extractor)
        working-directory: plugin/mcp
        run: npm ci

      - name: Run unit + harness tests
        working-directory: plugin/mcp
        env:
          PYTHONPATH: '.:../..'
        run: .venv/bin/python -m pytest ../../tests/unit/ ../../tests/journey/harness/tests/ ../../tests/effectiveness/tests/ -v

  lint:
    name: lint (ruff)
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'plugin/mcp/uv.lock'

      - name: Ruff check (MCP package + tests)
        working-directory: plugin/mcp
        run: uvx ruff@0.15.13 check chameleon_mcp/ ../../tests/unit/ ../../tests/journey/ ../scripts/

      - name: Ruff format check (MCP package + tests)
        working-directory: plugin/mcp
        run: uvx ruff@0.15.13 format --check chameleon_mcp/ ../../tests/unit/ ../../tests/journey/ ../scripts/

  shellcheck:
    name: shellcheck
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint hook scripts
        run: shellcheck -S warning plugin/hooks/_resolve-python.sh plugin/hooks/session-start plugin/hooks/preflight-and-advise plugin/hooks/peer-skill-advise plugin/hooks/posttool-recorder plugin/hooks/posttool-verify plugin/hooks/callout-detector plugin/hooks/stop-backstop plugin/scripts/*.sh scripts/*.sh

  hook-smoke:
    name: hook-smoke (${{ matrix.hook.name }})
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        hook:
          - name: session-start
            stdin: '{"session_id":"ci-smoke","hook_event_name":"SessionStart"}'
          - name: preflight-and-advise
            stdin: '{"tool_name":"Edit","tool_input":{"file_path":"/tmp/test.ts"},"session_id":"ci-test"}'
          - name: posttool-recorder
            stdin: '{"tool_name":"Bash","tool_input":{"command":"echo hi"},"tool_response":{"stdout":"hi"},"session_id":"ci-test"}'
          - name: posttool-verify
            stdin: '{"tool_name":"Edit","tool_input":{"file_path":"/tmp/test.ts"},"tool_response":{"content":"const x = 1;","success":true},"session_id":"ci-test"}'
          - name: callout-detector
            stdin: '{"user_prompt":"hello world","session_id":"ci-test"}'
          - name: peer-skill-advise
            stdin: '{"tool_name":"Skill","tool_input":{"skill":"superpowers:brainstorming"},"session_id":"ci-test"}'
          - name: stop-backstop
            stdin: '{"session_id":"ci-test","hook_event_name":"Stop"}'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'plugin/mcp/uv.lock'

      - name: Install Python dependencies (uv sync)
        working-directory: plugin/mcp
        run: uv sync --frozen

      - name: Invoke plugin/hooks/${{ matrix.hook.name }} with synthetic stdin
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/plugin
        run: |
          echo '${{ matrix.hook.stdin }}' \
            | plugin/hooks/${{ matrix.hook.name }} \
            | python3 -c "import json,sys; obj=json.loads(sys.stdin.read(), strict=False); assert isinstance(obj, dict), f'expected dict, got {type(obj).__name__}'; print('hook emitted valid JSON object')"

  hooks-manifest:
    name: hooks-manifest-check
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate hooks.json references
        run: |
          python3 << 'PYEOF'
          import json, sys, os
          errors = 0
          with open('plugin/hooks/hooks.json') as f:
              manifest = json.load(f)
          for event, entries in manifest.get('hooks', {}).items():
              for entry in entries:
                  for hook in entry.get('hooks', []):
                      cmd = hook.get('command', '')
                      name = cmd.split()[-1] if cmd else ''
                      path = 'plugin/hooks/' + name
                      if name and not os.path.isfile(path):
                          print(f'ERROR: {path} missing'); errors += 1
                      elif name and not os.access(path, os.X_OK):
                          print(f'ERROR: {path} not executable'); errors += 1
          for d in os.listdir('plugin/skills'):
              sd = os.path.join('plugin/skills', d)
              if os.path.isdir(sd) and not os.path.isfile(os.path.join(sd, 'SKILL.md')):
                  print(f'ERROR: {sd}/ missing SKILL.md'); errors += 1
          print(f'Checked hooks + skills: {errors} error(s)')
          sys.exit(1 if errors else 0)
          PYEOF

  build-tarball:
    name: build-tarball
    # verify-tag is what produces the `version` output consumed below; the rest
    # are the quality gates. verify-tag must stay listed even though the others
    # already depend on it — the prior `needs: test-all` alone left
    # needs.verify-tag.outputs.version unscoped, so VERSION rendered empty and
    # tar wrote a `chameleon-.tar.gz` next to itself. Every gate that covers the
    # shipped surface belongs here: a tarball built past a red one ships the
    # defect the gate exists to catch.
    needs: [verify-tag, test-all, lint, shellcheck, hook-smoke, hooks-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tarball-name: ${{ steps.archive.outputs.tarball-name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build release tarball
        id: archive
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          # Write the tarball to a sibling dir (../out) so tar isn't
          # reading from a tree it's writing into. v0.5.2's exclude
          # pattern alone wasn't enough: tar still emits "file changed
          # as we read it" + exit 1 when the destination lives in the
          # same dir being archived.
          OUT_DIR="${RUNNER_TEMP:-/tmp}/chameleon-release"
          mkdir -p "$OUT_DIR"
          TARBALL_NAME="chameleon-${VERSION}.tar.gz"
          TARBALL_PATH="${OUT_DIR}/${TARBALL_NAME}"
          echo "tarball-name=${TARBALL_NAME}" >> "$GITHUB_OUTPUT"
          echo "tarball-path=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"
          # Archive only the installable surface (plugin/) plus the
          # top-level README/LICENSE/CHANGELOG, so the release artifact
          # matches what a marketplace install ships (no tests/, docs/,
          # or dev scripts). Developer-local artefacts (.venv,
          # node_modules, __pycache__) are still excluded.
          tar \
            --exclude='*/.venv' \
            --exclude='*/node_modules' \
            --exclude='*/.chameleon' \
            --exclude='*/dist' \
            --exclude='*/__pycache__' \
            --exclude='*/.ruff_cache' \
            --exclude='*.pyc' \
            --exclude='*/.DS_Store' \
            -czf "${TARBALL_PATH}" \
            --transform "s,^,chameleon-${VERSION}/," \
            plugin README.md LICENSE CHANGELOG.md
          ls -lh "${TARBALL_PATH}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: ${{ steps.archive.outputs.tarball-path }}
          retention-days: 7

  create-release:
    name: create-release
    needs: [verify-tag, build-tarball]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: release-tarball

      - name: Stage published effectiveness artifacts
        id: eval-assets
        run: |
          # Attach every published eval run's run.md + metrics.json as
          # release assets named <run_id>-run.md / <run_id>-metrics.json
          # (see tests/effectiveness/results-published/README.md for the
          # publication policy). Old tags predate results-published/, so an
          # absent or empty dir stages zero files and the release proceeds
          # with the tarball alone.
          SRC="tests/effectiveness/results-published"
          OUT="${RUNNER_TEMP:-/tmp}/chameleon-eval-assets"
          mkdir -p "$OUT"
          COUNT=0
          if [ -d "$SRC" ]; then
            for RUN_DIR in "$SRC"/*/; do
              [ -d "$RUN_DIR" ] || continue
              RUN_ID=$(basename "$RUN_DIR")
              for FILE in run.md metrics.json; do
                if [ -f "${RUN_DIR}${FILE}" ]; then
                  cp "${RUN_DIR}${FILE}" "${OUT}/${RUN_ID}-${FILE}"
                  COUNT=$((COUNT + 1))
                fi
              done
            done
          fi
          echo "Staged ${COUNT} eval asset(s) in ${OUT}"
          ls -l "$OUT" || true
          echo "dir=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG entry for this version
        id: changelog
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          # Pull the section between `## [VERSION]` and the next `## [`.
          # awk prints lines between the two markers, exclusive of the
          # trailing marker.
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { found=1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$BODY" ]; then
            echo "WARN: no CHANGELOG body extracted for $VERSION; falling back to a generic message" >&2
            BODY="Release v${VERSION}. See CHANGELOG.md for details."
          fi

          # Multi-line outputs in GitHub Actions need a heredoc delimiter.
          {
            echo "body<<__CHAMELEON_CHANGELOG_END__"
            echo "$BODY"
            echo "__CHAMELEON_CHANGELOG_END__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: chameleon ${{ needs.verify-tag.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          # The eval-assets glob may match nothing (old tags, empty dir);
          # fail_on_unmatched_files defaults to false, so that is a warning,
          # never a failed release.
          files: |
            ${{ needs.build-tarball.outputs.tarball-name }}
            ${{ steps.eval-assets.outputs.dir }}/*
          draft: false
          prerelease: false
