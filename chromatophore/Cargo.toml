[package]
name = "chromatophore"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A universal code-convention engine: one tree-sitter parse layer, many languages, for chameleon to use"
license = "MIT"
repository = "https://github.com/crisnahine/chromatophore"

[[bin]]
name = "chromatophore"
path = "src/main.rs"

[lib]
name = "chromatophore"
path = "src/lib.rs"

[dependencies]
tree-sitter = "0.26.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
anyhow = "1.0.104"
rayon = "1.12.0"
twox-hash = "2.1.3"

# Grammars. Every one of these is parse-verified against tree-sitter 0.26.11
# by the `every_shipped_grammar_loads` test; ABI 14 and 15 both load, since the
# core accepts MIN_COMPATIBLE_LANGUAGE_VERSION..=LANGUAGE_VERSION (13..=15).
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-php = "0.24.2"
tree-sitter-bash = "0.25.1"
tree-sitter-scala = "0.26.0"
tree-sitter-swift = "0.7.3"
tree-sitter-lua = "0.5.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-haskell = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
# NOT tree-sitter-toml: that crate is stuck at 0.20 (pre-LanguageFn) and pulls a
# second, incompatible tree-sitter into the graph. -ng is the maintained fork.
tree-sitter-toml-ng = "0.7.0"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
