# PHP.

name = "php"
extensions = [".php"]

function_nodes = ["function_definition", "method_declaration", "anonymous_function_creation_expression", "arrow_function"]
class_nodes = ["class_declaration", "interface_declaration", "trait_declaration", "enum_declaration"]
branch_nodes = ["if_statement", "for_statement", "foreach_statement", "while_statement", "do_statement", "case_statement", "catch_clause", "conditional_expression"]
nesting_nodes = ["if_statement", "for_statement", "foreach_statement", "while_statement", "do_statement", "switch_statement", "try_statement"]
skip_subtree_nodes = ["comment", "string_content"]

[top_level_kinds]
function_definition = "FunctionDeclaration"
class_declaration = "ClassDeclaration"
interface_declaration = "InterfaceDeclaration"
trait_declaration = "TraitDeclaration"
enum_declaration = "EnumDeclaration"
namespace_definition = "NamespaceDefinition"
namespace_use_declaration = "UseDeclaration"
expression_statement = "ExpressionStatement"
comment = ""

[params]
positional = ["simple_parameter"]
rest = ["variadic_parameter"]

[fields]
name = "name"
parameters = "parameters"
body = "body"
return_type = "return_type"
call_function = "function"
member_object = "object"
member_property = "name"
param_type = "type"

[calls]
nodes = ["function_call_expression", "member_call_expression", "scoped_call_expression"]
member_nodes = ["member_access_expression"]
constructor_nodes = ["object_creation_expression"]
self_names = ["$this", "self", "static"]

[imports]
module_nodes = ["namespace_use_declaration"]

[flags]
decorator_nodes = ["attribute_list"]
