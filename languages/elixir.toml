# Elixir. Almost everything is a `call` in this grammar, including `def` and
# `defmodule`, so the top-level vocabulary is deliberately coarse.

name = "elixir"
extensions = [".ex", ".exs"]

function_nodes = ["anonymous_function"]
branch_nodes = ["stab_clause"]
nesting_nodes = ["do_block", "anonymous_function"]
skip_subtree_nodes = ["comment", "quoted_content"]

[top_level_kinds]
call = "Call"
alias = "Alias"
comment = ""

[fields]
call_function = "target"
member_object = "left"
member_property = "right"

[calls]
nodes = ["call"]
member_nodes = ["dot"]
# Elixir spells its definition macros as ordinary calls, so without this every
# module emits a row per `def` and any repo symbol named `test` or `use` picks up
# a repo-wide blast radius.
exclude_names = [
  "def", "defp", "defmodule", "defstruct", "defprotocol", "defimpl",
  "defmacro", "defmacrop", "defdelegate", "defexception", "defguard",
  "use", "alias", "require", "import", "test", "describe", "setup",
]

[flags]
